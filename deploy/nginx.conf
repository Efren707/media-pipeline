# Phase 10 (D22): serves the React build and proxies /api to Spring Boot on loopback.
# Installed as /etc/nginx/conf.d/media-pipeline.conf by scripts/deploy-demo.sh.
# Only SSH is open in the security group; browse through `ssh -L 8088:localhost:80`.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/media-pipeline;
    index index.html;

    # Uploads go straight to S3 via presigned URLs, so API bodies stay small.
    client_max_body_size 1m;
    server_tokens off;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed Vite assets can be cached; index.html must not be, so new deploys show up.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}
